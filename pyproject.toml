[project]
name = "airshop-agent"
version = "0.1.0"
description = "Local agent for IATA NDC AirShoppingRQ/RS flight shopping"
# openhands-sdk requires >=3.12. Upper bound is deliberate: PyYAML, pulled in
# transitively via openhands-sdk -> python-frontmatter, publishes no cp315
# wheels, so 'pip install' on Python 3.15 falls back to building from source and
# fails in Cython. Widen this once PyYAML ships cp315 wheels.
requires-python = ">=3.12,<3.15"
dependencies = [
    "openhands-sdk>=1.49",
    "pydantic>=2.7",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # The web API tests import the app, so the serve extra is required to test.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
airshop = "airshop.agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
