<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Airline-CMP self-test</title>
<style>
  body { background:#0f1115; color:#e6e9ef; font:13px/1.6 ui-monospace,Menlo,monospace; padding:24px; }
  h1 { font-size:15px; }
  .pass { color:#4ade80; } .fail { color:#ff6b6b; }
  pre { background:#0d1016; border:1px solid #2b303b; padding:12px; border-radius:8px; overflow:auto; }
</style>
</head>
<body>
<h1>Airline-CMP self-test — real browser DOM</h1>
<p>Runs the diff engine, trip/passenger comparison and chat against the reference.
Serve over HTTP (fetch cannot read local files from file://).</p>
<div id="result">running…</div>
<pre id="detail"></pre>

<script src="ndc-diff.js"></script>
<script src="ndc-report.js"></script>
<script src="ndc-trip.js"></script>
<script src="ndc-chat.js"></script>
<script>
(async function () {
  var out = document.getElementById("result");
  var detail = document.getElementById("detail");
  var lines = [];
  var failures = 0;

  function stable(v) {
    if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
    if (v && typeof v === "object") {
      return "{" + Object.keys(v).sort().map(function (k) {
        return JSON.stringify(k) + ":" + stable(v[k]);
      }).join(",") + "}";
    }
    return JSON.stringify(v);
  }
  function check(name, actual, want) {
    var a = stable(actual), w = stable(want);
    if (a === w) lines.push("PASS  " + name);
    else { failures++; lines.push("FAIL  " + name + "\n  expected " + w + "\n  actual   " + a); }
  }
  function truthy(name, actual) { check(name, Boolean(actual), true); }

  async function fetchText(paths) {
    for (var i = 0; i < paths.length; i++) {
      try {
        var res = await fetch(paths[i]);
        if (!res.ok) continue;
        var t = await res.text();
        if (/^\s*</.test(t) && t.indexOf("parsererror") === -1) return t;
      } catch (e) { /* next candidate */ }
    }
    return null;
  }
  async function fetchJson(paths) {
    for (var i = 0; i < paths.length; i++) {
      try {
        var res = await fetch(paths[i]);
        if (!res.ok) continue;
        var t = await res.text();
        if (/^\s*[{[]/.test(t)) return JSON.parse(t);
      } catch (e) { /* next candidate */ }
    }
    return null;
  }

  function rqXml(pax, legs, cabin) {
    var travelers = pax.map(function (p, i) {
      return "<Pax><PaxID>" + p + (i + 1) + "</PaxID><PTC>" + p + "</PTC></Pax>";
    }).join("");
    var ods = legs.map(function (l) {
      return "<OriginDest><OriginCode>" + l[0] + "</OriginCode><DestCode>" + l[1] +
        "</DestCode><DepartureDate>" + l[2] + "</DepartureDate><CabinTypeName>" + cabin +
        "</CabinTypeName></OriginDest>";
    }).join("");
    return "<AirShoppingRQ><Request><FlightRequest>" + ods + "</FlightRequest>" +
      "<PaxList>" + travelers + "</PaxList><ShoppingCriteria><CurParameter><CurCode>USD</CurCode>" +
      "</CurParameter></ShoppingCriteria></Request></AirShoppingRQ>";
  }

  try {
    var base = await fetchText(["../samples/airshopping_rs_baseline.xml", "samples/airshopping_rs_baseline.xml"]);
    var upd = await fetchText(["../samples/airshopping_rs_v2.xml", "samples/airshopping_rs_v2.xml"]);
    var expected = await fetchJson(["expected/diff_baseline_vs_v2.json", "web/expected/diff_baseline_vs_v2.json"]);
    if (!base || !upd || !expected) throw new Error("could not load fixtures (serve over http://)");

    // --- diff engine matches the Python reference --------------------------
    var report = NDC.diffXml(base, upd, "airshopping_rs_baseline.xml", "airshopping_rs_v2.xml");
    var baseSummary = NDC.summarizeMessage(NDC.parseXml(base), "airshopping_rs_baseline.xml");
    var newSummary = NDC.summarizeMessage(NDC.parseXml(upd), "airshopping_rs_v2.xml");
    check("identical flag", report.identical, expected.identical);
    check("entities_removed", report.entities_removed.map(function (e) { return [e.entity, e.key]; }),
          expected.entities_removed.map(function (e) { return [e.entity, e.key]; }));
    check("missing_nodes", report.missing_nodes, expected.missing_nodes);
    check("extra_nodes", report.extra_nodes, expected.extra_nodes);
    check("narrative", NDCReport.narrative(report, baseSummary.entity_counts, newSummary.entity_counts), expected.narrative);
    check("session metadata separated", report.session_metadata, expected.session_metadata);

    // --- trip shape classification ----------------------------------------
    var sOne = NDCTrip.tripShapeFromRq(NDC.parseXml(rqXml(["ADT"], [["LHR", "JFK", "2027-03-15"]], "Economy")));
    var sRound = NDCTrip.tripShapeFromRq(NDC.parseXml(
      rqXml(["ADT", "ADT", "CHD"], [["LHR", "JFK", "2027-03-15"], ["JFK", "LHR", "2027-03-22"]], "Business")));
    var sMulti = NDCTrip.tripShapeFromRq(NDC.parseXml(
      rqXml(["ADT"], [["LHR", "JFK", "2027-03-15"], ["JFK", "CDG", "2027-03-20"], ["CDG", "LHR", "2027-03-25"]], "Economy")));

    check("one-way classified", sOne.trip_type, "one-way");
    check("round-trip classified", sRound.trip_type, "round-trip");
    check("multi-city classified", sMulti.trip_type, "multi-city");
    check("pax mix read", sRound.pax, { ADT: 2, CHD: 1 });
    check("pax total read", sRound.pax_total, 3);
    check("cabin read", sRound.cabin, "Business");

    var change = NDCTrip.compareTripShape(sOne, sRound);
    check("trip change detected", change.trip_type_changed, true);
    check("added leg detected", change.legs_added, ["JFK->LHR on 2027-03-22"]);
    check("pax additions detected", change.pax_added, { ADT: 1, CHD: 1 });
    check("cabin change detected", change.cabin_changed, ["Economy", "Business"]);
    check("unchanged trip reported unchanged",
          NDCTrip.compareTripShape(sOne, NDCTrip.tripShapeFromRq(NDC.parseXml(
            rqXml(["ADT"], [["LHR", "JFK", "2027-03-15"]], "Economy")))).changed, false);

    // --- chat answers come from the report --------------------------------
    var ctx = {
      report: report,
      narrative: NDCReport.narrative(report, baseSummary.entity_counts, newSummary.entity_counts),
      baselineInventory: baseSummary.entity_counts,
      newInventory: newSummary.entity_counts,
      tripChange: change,
    };
    check("chat summary equals narrative", NDCChat.answer("summary", ctx), ctx.narrative);
    truthy("chat reports missing IT4", NDCChat.answer("what is missing?", ctx).indexOf("IT4") !== -1);
    truthy("chat reports extra node", NDCChat.answer("what is extra?", ctx).indexOf("MarketingMessages") !== -1);
    truthy("chat reports trip change", NDCChat.answer("did the trip type change?", ctx).indexOf("one-way") !== -1);
    truthy("chat reports pax change", NDCChat.answer("did pax change?", ctx).indexOf("Child") !== -1);
    truthy("chat reports counts", NDCChat.answer("how many offers", ctx).indexOf("Offer") !== -1);
    truthy("chat handles no context", NDCChat.answer("summary", null).indexOf("Upload") !== -1);
    truthy("chat help mentions offline", NDCChat.helpText().indexOf("offline") !== -1);

    // --- baseline persistence path ----------------------------------------
    var KEY = "airline-cmp.selftest";
    try {
      localStorage.setItem(KEY, JSON.stringify({ baseline_rs: { name: "x.xml", text: base } }));
      var back = JSON.parse(localStorage.getItem(KEY));
      check("baseline survives a storage round-trip", back.baseline_rs.text.length, base.length);
      localStorage.removeItem(KEY);
    } catch (e) {
      lines.push("SKIP  localStorage unavailable: " + e.message);
    }

    // --- malformed input rejected -----------------------------------------
    var threw = false;
    try { NDC.parseXml("<AirShoppingRS><unclosed>"); } catch (e) { threw = true; }
    truthy("malformed XML rejected", threw);
  } catch (err) {
    failures++;
    lines.push("EXCEPTION: " + (err && err.message ? err.message : err));
  }

  out.innerHTML = failures === 0
    ? '<span class="pass">ALL CHECKS PASSED in a real browser DOM</span>'
    : '<span class="fail">' + failures + ' CHECK(S) FAILED</span>';
  detail.textContent = lines.join("\n");
})();
</script>
</body>
</html>
